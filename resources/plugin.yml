name: SmartCombat
version: 0.0.1
main: CombatLog.SmartCombat
description: Smart Combatlog for Paper servers
author: Astra Studio (JayLgrs)
api-version: '1.21.11'

commands:
  smartcombat:
    description: Main command for SmartCombat.
    usage: /smartcombat reload
    aliases:
      - sc
    permission: smartcombat.reload

  spamkill:
    description: Manage your anti-spam-kill protection.
    usage: /spamkill protect <enable|disable|status>
    permission: smartcombat.spamkill

permissions:
  smartcombat.reload:
    description: Allows reloading SmartCombat configuration files.
    default: op

  smartcombat.spamkill:
    description: Allows players to manage their own spam-kill protection.
    default: true